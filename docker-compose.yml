version: '3.8'

services:
  web:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./site/public_html:/var/www/html
      - ./site/storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    restart: unless-stopped

  db:
    image: mariadb:10.11
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: opencart
      MYSQL_USER: opencart
      MYSQL_PASSWORD: opencart
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: opencart
      PMA_PASSWORD: opencart
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
